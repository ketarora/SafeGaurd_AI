<svg viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Circular Progress 1: Safety Recall -->
  <g transform="translate(150, 90)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f3f4f6" stroke-width="12"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="0" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="5" font-family="system-ui" font-size="24" font-weight="800" fill="#111827" text-anchor="middle" dominant-baseline="middle">100%</text>
    <text x="0" y="95" font-family="system-ui" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">Safety Recall</text>
  </g>
  
  <!-- Circular Progress 2: Pipeline Escalation Recall -->
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f3f4f6" stroke-width="12"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#3b82f6" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="6" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="5" font-family="system-ui" font-size="24" font-weight="800" fill="#111827" text-anchor="middle" dominant-baseline="middle">98.4%</text>
    <text x="0" y="95" font-family="system-ui" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">Escalation Recall</text>
  </g>

  <!-- Circular Progress 3: Intent Accuracy -->
  <g transform="translate(650, 90)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f3f4f6" stroke-width="12"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="37" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="5" font-family="system-ui" font-size="24" font-weight="800" fill="#111827" text-anchor="middle" dominant-baseline="middle">90.0%</text>
    <text x="0" y="95" font-family="system-ui" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">Intent Accuracy</text>
  </g>
</svg>
