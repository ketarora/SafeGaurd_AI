<svg viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="16" fill="#111827"/>
  <!-- Circular Progress 1: Safety Recall -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#374151" stroke-width="12"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="0" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="0" font-family="system-ui" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">100%</text>
    <text x="0" y="105" font-family="system-ui" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">Safety Recall</text>
  </g>
  
  <!-- Circular Progress 2: Pipeline Escalation Recall -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#374151" stroke-width="12"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3b82f6" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="8" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="0" font-family="system-ui" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">98.4%</text>
    <text x="0" y="105" font-family="system-ui" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">Escalation Recall</text>
  </g>

  <!-- Circular Progress 3: Intent Accuracy -->
  <g transform="translate(650, 100)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#374151" stroke-width="12"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="44" transform="rotate(-90)" stroke-linecap="round"/>
    <text x="0" y="0" font-family="system-ui" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">90.0%</text>
    <text x="0" y="105" font-family="system-ui" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">Intent Accuracy</text>
  </g>
</svg>
