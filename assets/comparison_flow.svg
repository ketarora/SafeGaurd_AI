<svg width="1000" height="550" viewBox="0 0 1000 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="550" fill="#ffffff" rx="16"/>
  <defs>
    <pattern id="gridcomp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f3f4f6" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1000" height="550" fill="url(#gridcomp)" rx="16"/>

  <!-- TOP PANEL: Standard Naive Agent -->
  <rect x="40" y="40" width="920" height="180" rx="12" fill="#fff5f5" stroke="#fecaca" stroke-width="2"/>
  <text x="60" y="70" font-family="system-ui" font-weight="800" font-size="16" fill="#ef4444">THE STANDARD APPROACH (NAIVE LLM)</text>
  <text x="60" y="90" font-family="system-ui" font-weight="500" font-size="12" fill="#991b1b">High risk of hallucination and dangerous safety resolution bypasses.</text>

  <!-- Flow Standard -->
  <path d="M 120 140 L 400 140 L 680 140" stroke="#fca5a5" stroke-width="3" stroke-dasharray="8 8"/>
  <polygon points="400,140 390,135 390,145" fill="#fca5a5"/>
  <polygon points="680,140 670,135 670,145" fill="#fca5a5"/>
  
  <g transform="translate(60, 115)">
    <rect width="120" height="50" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="60" y="26" font-family="system-ui" font-weight="700" font-size="12" fill="#991b1b" text-anchor="middle">Customer Input</text>
  </g>
  <g transform="translate(420, 115)" filter="url(#shadow)">
    <rect width="200" height="50" rx="8" fill="#ef4444"/>
    <text x="100" y="29" font-family="system-ui" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">Black-Box LLM Call</text>
  </g>
  <g transform="translate(720, 115)">
    <rect width="160" height="50" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="80" y="26" font-family="system-ui" font-weight="700" font-size="12" fill="#991b1b" text-anchor="middle">Generic Hallucinated Reply</text>
  </g>

  <!-- Divider -->
  <path d="M 40 260 L 960 260" stroke="#e5e7eb" stroke-width="2"/>
  <path d="M 40 264 L 960 264" stroke="#e5e7eb" stroke-width="2"/>

  <!-- BOTTOM PANEL: SafeGuard AI -->
  <rect x="40" y="310" width="920" height="200" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="60" y="340" font-family="system-ui" font-weight="800" font-size="16" fill="#10B981">THE SAFEGUARD AI APPROACH</text>
  <text x="60" y="360" font-family="system-ui" font-weight="500" font-size="12" fill="#065f46">Deterministic safety guardrails with strict retrieval-grounded generation.</text>

  <!-- Flow SafeGuard -->
  <path d="M 120 430 L 250 430" stroke="#6ee7b7" stroke-width="3"/>
  <path d="M 410 430 L 520 430" stroke="#6ee7b7" stroke-width="3"/>
  <path d="M 660 430 L 760 430" stroke="#6ee7b7" stroke-width="3"/>
  
  <polygon points="250,430 240,425 240,435" fill="#6ee7b7"/>
  <polygon points="520,430 510,425 510,435" fill="#6ee7b7"/>
  <polygon points="760,430 750,425 750,435" fill="#6ee7b7"/>

  <!-- Input -->
  <g transform="translate(60, 405)">
    <rect width="120" height="46" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
    <text x="60" y="27" font-family="system-ui" font-weight="700" font-size="12" fill="#065f46" text-anchor="middle">Customer Input</text>
  </g>

  <!-- Classifier -->
  <g transform="translate(260, 405)" filter="url(#shadow)">
    <rect width="140" height="46" rx="8" fill="#111827"/>
    <text x="70" y="27" font-family="system-ui" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">Hard Guardrails</text>
  </g>
  <!-- Flag above guardrail -->
  <rect x="295" y="375" width="70" height="20" rx="4" fill="#ef4444"/>
  <text x="330" y="389" font-family="monospace" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">ESCALATE</text>
  <path d="M 330 395 L 330 405" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- RAG -->
  <g transform="translate(540, 405)" filter="url(#shadow)">
    <rect width="110" height="46" rx="8" fill="#10B981"/>
    <text x="55" y="27" font-family="system-ui" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">Vector RAG</text>
  </g>

  <!-- Output -->
  <g transform="translate(780, 395)">
    <rect width="150" height="66" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
    <text x="75" y="26" font-family="system-ui" font-weight="700" font-size="12" fill="#065f46" text-anchor="middle">Contextual &amp; Safe</text>
    <text x="75" y="44" font-family="system-ui" font-weight="700" font-size="12" fill="#065f46" text-anchor="middle">Resolution</text>
  </g>
</svg>
